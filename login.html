<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login</title><link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body>
<h1>Login</h1>
<form id="loginForm" style="max-width:400px">
<input type="email" id="email" placeholder="Email" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Login</button>
<p>No account? <a href="signup.html">Sign Up</a></p>
</form>
<script>
document.getElementById("loginForm").addEventListener("submit",function(e){
e.preventDefault();
let users=JSON.parse(localStorage.getItem("users"))||[];
let found=users.find(u=>u.email===document.getElementById("email").value && u.password===document.getElementById("password").value);
if(found){localStorage.setItem("currentUser",JSON.stringify(found));window.location.href="index.html";}
else{alert("Wrong email or password!")}
});
</script>
</body></html>

<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up</title><link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head>
<body>
<h1>Sign Up</h1>
<form id="signupForm" style="max-width:400px">
<input type="text" id="name" placeholder="Full Name" required>
<input type="email" id="email" placeholder="Email" required>
<input type="password" id="password" placeholder="Password" required>
<button type="submit">Create Account</button>
<p>Already have account? <a href="login.html">Login</a></p>
</form>
<script>
document.getElementById("signupForm").addEventListener("submit",function(e){
e.preventDefault();
let users=JSON.parse(localStorage.getItem("users"))||[];
let newUser={name:document.getElementById("name").value,email:document.getElementById("email").value,password:document.getElementById("password").value};
users.push(newUser);
localStorage.setItem("users",JSON.stringify(users));
localStorage.setItem("currentUser",JSON.stringify(newUser));
alert("Account created! Welcome "+newUser.name);
window.location.href="index.html";
});
</script>
</body></html>
